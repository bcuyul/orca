name: Adaptive Proportional Routing

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [feat/adaptive-xp-skills-isolation]
    paths:
      - '.github/workflows/adaptive-proportional-routing-ci.yml'
      - 'src/shared/adaptive-delivery/**'
      - 'docs/project-hub/ADAPTIVE_PROPORTIONAL_ROUTING_PR14.md'
      - 'skills/adaptive-*/**'
      - 'AGENTS.md'

permissions:
  contents: read

jobs:
  routing:
    name: Proportional routing (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24'
          cache-pnpm-store: 'false'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: config/.bun-version
          no-cache: true
      - name: Lint
        run: pnpm exec oxlint src/shared/adaptive-delivery
      - name: Test proportional routing and existing priority engine
        run: pnpm exec vitest run --config config/vitest.config.ts src/shared/adaptive-delivery
      - name: Typecheck
        run: pnpm typecheck
